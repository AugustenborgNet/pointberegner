<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vi er flyttet</title>
<meta http-equiv="refresh" content="5;url=https://www.augustenborgnet.dk/">
<style>
  :root{
    --ink:#12241d;
    --muted:#4c5d55;
    --accent:#0e6b4f;
    --accent-dark:#073c2d;
    --accent-soft:#e5f2ec;
    --paper:#f5f9f7;
    --line:#dbe8e1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:transparent;
    font-family:'Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif;
    color:var(--ink);
    padding:0;
  }
  .card{
    max-width:640px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:44px 36px;
    text-align:center;
  }
  h1{font-size:26px;margin:0 0 10px;}
  p{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 22px;}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:15px;
    padding:12px 26px;
    border-radius:10px;
    transition:background .15s ease;
  }
  .btn:hover{background:var(--accent-dark);}
  .note{
    margin-top:18px;
    font-size:12.5px;
    color:var(--muted);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Vi er flyttet!</h1>
    <p>Vores hjemmeside er flyttet til en ny adresse. Klik på knappen herunder for at komme derhen.</p>
    <a class="btn" href="https://www.augustenborgnet.dk/" target="_blank" rel="noopener">Gå til augustenborgnet.dk &rarr;</a>
    <p class="note">Klik på knappen for at komme videre til vores nye side.</p>
  </div>

</body>
</html>
